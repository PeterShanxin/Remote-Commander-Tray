name: One-shot cleanup stale v0.1.0 draft

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-stale-release.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the known stale draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id=392067096
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"

          if [[ "$(jq -r '.draft' <<<"${release}")" != "true" ]]; then
            echo "Refusing cleanup: release ${release_id} is not a draft." >&2
            exit 1
          fi

          if [[ "$(jq -r '.name' <<<"${release}")" != "Remote Commander Tray v0.1.0" ]]; then
            echo "Refusing cleanup: unexpected release name." >&2
            exit 1
          fi

          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"

          if gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" >/dev/null 2>&1; then
            echo "Draft release still exists after deletion." >&2
            exit 1
          fi

          echo "Deleted stale draft release ${release_id}."

      - name: Remove this one-shot workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=".github/workflows/cleanup-stale-release.yml"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha')"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f message="chore: remove one-shot release cleanup" \
            -f sha="${sha}" \
            -f branch="main" >/dev/null
