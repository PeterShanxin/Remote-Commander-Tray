name: Sync GitHub release to Microsoft Store

on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_id:
        description: Stable release ID verified and published by this CI run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: store-release-sync
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'PeterShanxin/Remote-Commander-Tray' &&
      github.actor == 'PeterShanxin' &&
      github.triggering_actor == 'PeterShanxin' &&
      ((github.event_name == 'release' &&
        !github.event.release.draft && !github.event.release.prerelease) ||
       (inputs.release_id != '' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on: ubuntu-latest
    outputs:
      published_at: ${{ steps.release.outputs.published_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact public release source and version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id || github.event.release.id }}
        run: |
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          jq -e '
            (.draft == false) and (.prerelease == false)
            and (.published_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
            and ([.assets[] | select(.state == "uploaded" and .size > 0 and
                  ((.digest // "") | test("^sha256:[a-f0-9]{64}$"))) | .name] as $complete |
                 (["RemoteCommanderTray-win-x64.exe", "RemoteCommanderTray-win-arm64.exe",
                   "RemoteCommanderTray-linux-beta.tar.gz"] - $complete | length == 0))
          ' <<< "$release" >/dev/null
          RELEASE_TAG="$(jq -r .tag_name <<< "$release")"
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 tools/sync-store-release.py verify-tag "$RELEASE_TAG" Directory.Build.props
          echo "published_at=$(jq -r .published_at <<< "$release")" >> "$GITHUB_OUTPUT"

  packages:
    needs: verify
    uses: ./.github/workflows/store.yml

  submit:
    needs: [verify, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: store-submission
    steps:
      - name: Check explicit activation and publication cutoff
        id: activation
        env:
          ENABLED: ${{ vars.STORE_RELEASE_AUTOMATION_ENABLED }}
          AFTER: ${{ vars.STORE_RELEASES_AFTER }}
          PUBLISHED: ${{ needs.verify.outputs.published_at }}
        run: |
          if [[ "$ENABLED" != true ]]; then
            echo "Microsoft Store automation is disabled."
            exit 0
          fi
          python3 - <<'PY'
          import datetime, os, re
          def timestamp(key):
              value = os.environ[key]
              if not re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z", value):
                  raise SystemExit("Missing or malformed UTC Store activation cutoff or release timestamp.")
              return datetime.datetime.fromisoformat(value)
          if timestamp("PUBLISHED") > timestamp("AFTER"):
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  print("active=true", file=output)
          else:
              print("Historical release; no Microsoft Store action.")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.activation.outputs.active == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.activation.outputs.active == 'true'
        with:
          pattern: Store-*
          path: ${{ runner.temp }}/store-assets
      - name: Submit exactly the validated packages for certification
        if: steps.activation.outputs.active == 'true'
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          STORE_ASSET_ROOT: ${{ runner.temp }}/store-assets
        run: python3 tools/sync-store-release.py submit "$GITHUB_SHA" Directory.Build.props "$STORE_ASSET_ROOT"

  inventory:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release_id == '' &&
      github.repository == 'PeterShanxin/Remote-Commander-Tray' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'PeterShanxin' && github.triggering_actor == 'PeterShanxin'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: store-submission
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read published versions and pending certification
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: python3 tools/sync-store-release.py inventory
