name: Linux

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Portable Core (.NET 8 / Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test tests/RemoteCommanderTray.Core.Tests/RemoteCommanderTray.Core.Tests.csproj -c Release

  linux-beta:
    name: Linux Beta (Ubuntu user service and desktop)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb x11-utils libglib2.0-bin
      - name: Start disposable runner user manager
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - run: python3 -m unittest discover -s tests/linux -v
      - name: Build Linux Beta archive
        run: bash tools/package-linux-beta.sh
      - name: Exercise unpacked beta on a synthetic CLI
        run: |
          mkdir -p "$RUNNER_TEMP/tray-linux"
          tar -xzf publish/RemoteCommanderTray-linux-beta.tar.gz -C "$RUNNER_TEMP/tray-linux"
          bash tests/linux/smoke.sh "$RUNNER_TEMP/tray-linux/RemoteCommanderTray-linux-beta"
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteCommanderTray-linux-beta
          path: publish/RemoteCommanderTray-linux-beta.tar.gz
          if-no-files-found: error
