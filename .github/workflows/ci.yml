name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore RemoteCommanderTray.sln

      - name: Build
        run: dotnet build RemoteCommanderTray.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/RemoteCommanderTray.Core.Tests/RemoteCommanderTray.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: windows-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: >
          dotnet publish src/RemoteCommanderTray/RemoteCommanderTray.csproj
          -c Release
          -r ${{ matrix.rid }}
          -o publish/${{ matrix.rid }}

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: RemoteCommanderTray-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/RemoteCommanderTray.exe
          if-no-files-found: error

  icon:
    name: Verify generated icon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The committed .ico must match what tools/generate-icon.py produces, so the
      # repository's only binary asset stays reproducible from source.
      - name: Regenerate and compare
        shell: bash
        run: |
          python tools/generate-icon.py
          git diff --exit-code -- src/RemoteCommanderTray/app.ico

  release:
    name: Attach binaries to the release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename per architecture
        run: |
          mkdir -p release
          cp artifacts/RemoteCommanderTray-win-x64/RemoteCommanderTray.exe release/RemoteCommanderTray-win-x64.exe
          cp artifacts/RemoteCommanderTray-win-arm64/RemoteCommanderTray.exe release/RemoteCommanderTray-win-arm64.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          draft: true
          generate_release_notes: true
