name: CI

on:
  # Branch pushes are covered by the pull_request trigger. Listing "**" here too
  # made every PR commit run the whole matrix twice.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Build and test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore RemoteCommanderTray.sln

      - name: Build
        run: dotnet build RemoteCommanderTray.sln -c Release --no-restore

      - name: Test
        run: dotnet test RemoteCommanderTray.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Native lifecycle integration
        run: dotnet run --project tests/RemoteCommanderTray.Windows.Integration -c Release --no-build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.arch }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  test-gate:
    name: Build and test
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both native architectures
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success

  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: windows-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: >
          dotnet publish src/RemoteCommanderTray/RemoteCommanderTray.csproj
          -c Release
          -r ${{ matrix.rid }}
          -o publish/${{ matrix.rid }}

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: RemoteCommanderTray-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/RemoteCommanderTray.exe
          if-no-files-found: error

  icon:
    name: Verify generated icon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The committed .ico must match what tools/generate-icon.py produces, so the
      # repository's only binary asset stays reproducible from source.
      - name: Regenerate and compare
        shell: bash
        run: |
          python tools/generate-icon.py
          git diff --exit-code -- src/RemoteCommanderTray/app.ico

  release:
    name: Publish versioned release
    runs-on: ubuntu-latest
    needs: publish
    # A version bump merged to main creates the release automatically. Tag pushes are
    # still supported for recovery/manual releases. Pull requests never publish.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            version="$(python - <<'PY'
          import xml.etree.ElementTree as ET
          version = ET.parse("src/RemoteCommanderTray/RemoteCommanderTray.csproj").getroot().findtext(".//Version")
          if not version:
              raise SystemExit("RemoteCommanderTray.csproj has no <Version>")
          print(version.strip())
          PY
            )"
            tag="v${version}"
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${tag}" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>&1; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Release ${tag} already exists; nothing to publish."
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            echo "Release ${tag} does not exist; preparing it from ${GITHUB_SHA}."
          fi

      - uses: actions/download-artifact@v4
        if: steps.release.outputs.publish == 'true'
        with:
          pattern: RemoteCommanderTray-*
          path: artifacts

      - name: Rename per architecture
        if: steps.release.outputs.publish == 'true'
        run: |
          mkdir -p release
          cp artifacts/RemoteCommanderTray-win-x64/RemoteCommanderTray.exe release/RemoteCommanderTray-win-x64.exe
          cp artifacts/RemoteCommanderTray-win-arm64/RemoteCommanderTray.exe release/RemoteCommanderTray-win-arm64.exe

      - name: Create draft release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Remote Commander Tray ${{ steps.release.outputs.tag }}
          files: release/*.exe
          draft: true
          generate_release_notes: true
          body: |
            First public release of **Remote Commander Tray** — a lightweight Windows
            system-tray supervisor for the official Desktop Commander Remote Device.

            ### Install
            - **Windows ARM64:** `RemoteCommanderTray-win-arm64.exe`
            - **Windows x64:** `RemoteCommanderTray-win-x64.exe`
            - Install the official agent once with:
              `npm install -g @wonderwhy-er/desktop-commander`
            - Put the executable somewhere stable, run it, then enable **Launch at sign-in**.

            > If you already run `desktop-commander remote` from a terminal or Scheduled
            > Task, stop/disable that launcher before letting the tray supervise the agent.
            > Do not run two supervisors at the same time.

      - name: Verify assets and publish
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          expected=(
            "RemoteCommanderTray-win-x64.exe"
            "RemoteCommanderTray-win-arm64.exe"
          )

          for attempt in {1..10}; do
            assets="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[].name' 2>/dev/null || true)"
            ready=true
            for name in "${expected[@]}"; do
              grep -Fxq "${name}" <<<"${assets}" || ready=false
            done
            if [[ "${ready}" == true ]]; then
              break
            fi
            sleep 2
          done

          for name in "${expected[@]}"; do
            size="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}"               --jq ".assets[] | select(.name == \"${name}\") | .size")"
            if [[ -z "${size}" || "${size}" -lt 1000000 ]]; then
              echo "Release asset ${name} is missing or unexpectedly small (${size:-missing})." >&2
              exit 1
            fi
            echo "Verified ${name}: ${size} bytes"
          done

          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
          echo "Published ${TAG}."
