name: CI

on:
  # Branch pushes are covered by the pull_request trigger. Listing "**" here too
  # made every PR commit run the whole matrix twice.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Build and test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore RemoteCommanderTray.sln

      - name: Build
        run: dotnet build RemoteCommanderTray.sln -c Release --no-restore

      - name: Test
        run: dotnet test RemoteCommanderTray.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Native lifecycle integration
        run: dotnet run --project tests/RemoteCommanderTray.Windows.Integration -c Release --no-build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.arch }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  test-gate:
    name: Build and test
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both native architectures
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success

  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: windows-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: >
          dotnet publish src/RemoteCommanderTray/RemoteCommanderTray.csproj
          -c Release
          -r ${{ matrix.rid }}
          -o publish/${{ matrix.rid }}

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: RemoteCommanderTray-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/RemoteCommanderTray.exe
          if-no-files-found: error

  icon:
    name: Verify generated icon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The committed .ico must match what tools/generate-icon.py produces, so the
      # repository's only binary asset stays reproducible from source.
      - name: Regenerate and compare
        shell: bash
        run: |
          python tools/generate-icon.py
          git diff --exit-code -- src/RemoteCommanderTray/app.ico

  release:
    name: Publish versioned release
    runs-on: ubuntu-latest
    needs: [publish, icon, test-gate]
    # A version bump merged to main creates the release automatically. Tag pushes are
    # still supported for recovery/manual releases. Pull requests never publish.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(python - <<'PY'
          import xml.etree.ElementTree as ET

          props = ET.parse("Directory.Build.props").getroot()
          version = (props.findtext(".//Version") or "").strip()
          if not version:
              raise SystemExit("Directory.Build.props has no <Version>")

          # Keep one version source. The SDK derives assembly/file/informational
          # versions from Version; explicit duplicates can silently drift.
          for name in ("AssemblyVersion", "FileVersion", "InformationalVersion"):
              if props.findtext(f".//{name}"):
                  raise SystemExit(f"Directory.Build.props must not define <{name}> separately")

          project = ET.parse("src/RemoteCommanderTray/RemoteCommanderTray.csproj").getroot()
          if project.findtext(".//Version"):
              raise SystemExit("RemoteCommanderTray.csproj must not override <Version>")

          print(version)
          PY
          )"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ "${tag}" != "v${version}" ]]; then
              echo "Tag ${tag} does not match application version v${version}." >&2
              exit 1
            fi
          else
            tag="v${version}"
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${tag}" >&2
            exit 1
          fi

          prerelease=false
          if [[ "${tag}" == *-* ]]; then
            prerelease=true
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

          api_get() {
            local url="$1"
            local output="$2"
            curl --silent --show-error --location \
              --output "${output}" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${url}"
          }

          release_json="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${tag}\")")"

          if [[ -n "${release_json}" ]]; then
            release_id="$(jq -r '.id' <<<"${release_json}")"
            if [[ "$(jq -r '.draft' <<<"${release_json}")" == "true" ]]; then
              action=resume
              echo "Draft release ${tag} (id ${release_id}) exists; resuming it."
            else
              action=skip
              echo "Published release ${tag} (id ${release_id}) already exists; nothing to do."
            fi
          else
            release_id=""
            action=create
            echo "Release ${tag} does not exist; preparing it from ${GITHUB_SHA}."
          fi

          # A published release is immutable for this workflow. On create/resume,
          # however, never attach binaries from today's main to an older existing tag.
          if [[ "${action}" != "skip" ]]; then
            tag_file="$(mktemp)"
            tag_status="$(api_get "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" "${tag_file}")"
            case "${tag_status}" in
              200)
                tag_ref="$(cat "${tag_file}")"
                object_type="$(jq -r '.object.type' <<<"${tag_ref}")"
                object_sha="$(jq -r '.object.sha' <<<"${tag_ref}")"
                while [[ "${object_type}" == "tag" ]]; do
                  tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
                  object_type="$(jq -r '.object.type' <<<"${tag_object}")"
                  object_sha="$(jq -r '.object.sha' <<<"${tag_object}")"
                done

                if [[ "${object_type}" != "commit" || "${object_sha}" != "${GITHUB_SHA}" ]]; then
                  echo "Existing tag ${tag} resolves to ${object_type} ${object_sha}, not current commit ${GITHUB_SHA}." >&2
                  exit 1
                fi
                ;;
              404)
                ;;
              *)
                echo "Tag lookup for ${tag} failed with HTTP ${tag_status}; refusing to publish." >&2
                exit 1
                ;;
            esac
            rm -f "${tag_file}"
          fi

          echo "action=${action}" >> "${GITHUB_OUTPUT}"
          echo "release_id=${release_id}" >> "${GITHUB_OUTPUT}"

      - uses: actions/download-artifact@v4
        if: steps.release.outputs.action != 'skip'
        with:
          pattern: RemoteCommanderTray-*
          path: artifacts

      - name: Prepare release files and notes
        if: steps.release.outputs.action != 'skip'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/RemoteCommanderTray-win-x64/RemoteCommanderTray.exe release/RemoteCommanderTray-win-x64.exe
          cp artifacts/RemoteCommanderTray-win-arm64/RemoteCommanderTray.exe release/RemoteCommanderTray-win-arm64.exe

          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${TAG}" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq '.body' > generated-notes.md

          printf '**Remote Commander Tray %s** — a lightweight Windows system-tray\n' "${TAG}" > release-notes.md
          cat >> release-notes.md <<'EOF'
          supervisor for the official Desktop Commander Remote Device.

          ### Install
          - **Windows ARM64:** `RemoteCommanderTray-win-arm64.exe`
          - **Windows x64:** `RemoteCommanderTray-win-x64.exe`
          - Install the official agent once with:
            `npm install -g @wonderwhy-er/desktop-commander`
          - Put the executable somewhere stable, run it, then enable **Launch at sign-in**.

          > If you already run `desktop-commander remote` from a terminal or Scheduled
          > Task, stop/disable that launcher before letting the tray supervise the agent.
          > Do not run two supervisors at the same time.
          EOF

          if [[ -s generated-notes.md ]]; then
            printf '\n\n---\n\n' >> release-notes.md
            cat generated-notes.md >> release-notes.md
          fi

      - name: Create or refresh draft release
        id: draft
        if: steps.release.outputs.action != 'skip'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ACTION: ${{ steps.release.outputs.action }}
          EXISTING_RELEASE_ID: ${{ steps.release.outputs.release_id }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          title="Remote Commander Tray ${TAG}"

          if [[ "${ACTION}" == "create" ]]; then
            release_json="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="${TAG}" \
              -f target_commitish="${GITHUB_SHA}" \
              -f name="${title}" \
              -F body=@release-notes.md \
              -F draft=true \
              -F prerelease="${PRERELEASE}")"
            release_id="$(jq -r '.id' <<<"${release_json}")"
          else
            release_id="${EXISTING_RELEASE_ID}"
            if [[ ! "${release_id}" =~ ^[0-9]+$ ]]; then
              echo "Draft release id is missing or invalid: ${release_id}" >&2
              exit 1
            fi
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f name="${title}" \
              -f target_commitish="${GITHUB_SHA}" \
              -F body=@release-notes.md \
              -F draft=true \
              -F prerelease="${PRERELEASE}" >/dev/null
          fi

          if [[ ! "${release_id}" =~ ^[0-9]+$ ]]; then
            echo "Created release id is missing or invalid: ${release_id}" >&2
            exit 1
          fi
          echo "release_id=${release_id}" >> "${GITHUB_OUTPUT}"

          gh release upload "${TAG}" \
            release/RemoteCommanderTray-win-x64.exe \
            release/RemoteCommanderTray-win-arm64.exe \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      - name: Verify assets and publish
        if: steps.release.outputs.action != 'skip'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_ID}" =~ ^[0-9]+$ ]]; then
            echo "Release id is missing or invalid: ${RELEASE_ID}" >&2
            exit 1
          fi

          expected=(
            "RemoteCommanderTray-win-x64.exe"
            "RemoteCommanderTray-win-arm64.exe"
          )

          for attempt in {1..10}; do
            draft_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
            assets="$(jq -r '.assets[].name' <<<"${draft_json}")"
            ready=true
            for name in "${expected[@]}"; do
              grep -Fxq "${name}" <<<"${assets}" || ready=false
            done
            if [[ "${ready}" == true ]]; then
              break
            fi
            sleep 2
          done

          draft_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          if [[ "$(jq -r '.draft' <<<"${draft_json}")" != "true" ]]; then
            echo "Release ${TAG} is no longer a draft before verification." >&2
            exit 1
          fi
          if [[ "$(jq -r '.tag_name' <<<"${draft_json}")" != "${TAG}" ]]; then
            echo "Release id ${RELEASE_ID} has an unexpected tag." >&2
            exit 1
          fi

          for name in "${expected[@]}"; do
            size="$(jq -r --arg name "${name}" '.assets[] | select(.name == $name) | .size' <<<"${draft_json}")"
            if [[ -z "${size}" || "${size}" == "null" || "${size}" -lt 1000000 ]]; then
              echo "Release asset ${name} is missing or unexpectedly small (${size:-missing})." >&2
              exit 1
            fi
            echo "Verified ${name}: ${size} bytes"
          done

          make_latest=true
          if [[ "${PRERELEASE}" == "true" ]]; then
            make_latest=false
          fi

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -F prerelease="${PRERELEASE}" \
            -f make_latest="${make_latest}" >/dev/null

          final="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          if [[ "$(jq -r '.draft' <<<"${final}")" != "false" ]]; then
            echo "Release ${TAG} is still a draft after publish." >&2
            exit 1
          fi
          if [[ "$(jq -r '.tag_name' <<<"${final}")" != "${TAG}" ]]; then
            echo "Published release id ${RELEASE_ID} has an unexpected tag." >&2
            exit 1
          fi
          if [[ "$(jq -r '.prerelease' <<<"${final}")" != "${PRERELEASE}" ]]; then
            echo "Release ${TAG} prerelease status does not match ${PRERELEASE}." >&2
            exit 1
          fi

          public_release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id')"
          if [[ "${public_release_id}" != "${RELEASE_ID}" ]]; then
            echo "Published tag lookup resolved to release ${public_release_id}, expected ${RELEASE_ID}." >&2
            exit 1
          fi

          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          object_type="$(jq -r '.object.type' <<<"${tag_ref}")"
          object_sha="$(jq -r '.object.sha' <<<"${tag_ref}")"
          while [[ "${object_type}" == "tag" ]]; do
            tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
            object_type="$(jq -r '.object.type' <<<"${tag_object}")"
            object_sha="$(jq -r '.object.sha' <<<"${tag_object}")"
          done
          if [[ "${object_type}" != "commit" || "${object_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Published tag ${TAG} resolves to ${object_type} ${object_sha}, expected commit ${GITHUB_SHA}." >&2
            exit 1
          fi

          echo "Published ${TAG} (release_id=${RELEASE_ID}, prerelease=${PRERELEASE}, latest=${make_latest})."
