name: Store package
on:
  pull_request:
  push:
    branches: [main]
    paths: [Directory.Build.props]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
jobs:
  submission-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests/store -v

  package:
    name: MSIX (${{ matrix.arch }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check reproducible assets
        run: |
          python tools/generate-store-assets.py
          git diff --exit-code -- packaging/Assets
      - name: Read Store package version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content -LiteralPath Directory.Build.props -Raw
          $versions = @($props.SelectNodes('/Project/PropertyGroup/StorePackageVersion'))
          if ($versions.Count -ne 1) { throw 'Set exactly one StorePackageVersion in Directory.Build.props.' }
          $version = $versions[0].InnerText
          if ($version -cnotmatch '^[1-9][0-9]*\.[0-9]+\.[0-9]+\.0$') { throw 'Invalid StorePackageVersion.' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build and validate package
        shell: pwsh
        run: ./tools/build-store.ps1 -Architecture '${{ matrix.arch }}' -PackageVersion '${{ steps.version.outputs.value }}' -OutputDirectory artifacts/store
      - name: Save unsigned Store submission package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Store-${{ matrix.arch }}
          path: |
            artifacts/store/*.msix
            artifacts/store/build-info.json
            artifacts/store/makeappx.log
          if-no-files-found: error
      - name: Install and launch x64 package on disposable runner
        if: matrix.arch == 'x64'
        shell: pwsh
        run: ./tools/test-store-install.ps1 -PackagePath artifacts/store/RemoteCommanderTray_${{ steps.version.outputs.value }}_x64.msix
